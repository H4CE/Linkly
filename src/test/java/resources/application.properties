# ?????????????????????????????????????????
# Test database ? H2 in-memory
# ?????????????????????????????????????????
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ?????????????????????????????????????????
# JWT ? test values
# ?????????????????????????????????????????
app.jwt.secret=testSecretKeyForTestingPurposesOnlyNotForProduction123
app.jwt.expiry=3600000

# ?????????????????????????????????????????
# App config
# ?????????????????????????????????????????
app.base-url=http://localhost:8080

# ?????????????????????????????????????????
# Verification
# ?????????????????????????????????????????
app.verification.secret=testVerificationSecretForTestingPurposesOnly123

# ?????????????????????????????????????????
# Gemini ? not used in tests, mocked
# ?????????????????????????????????????????
app.gemini.api-key=test-key
app.gemini.api-url=http://localhost:9999/mock
app.gemini.max-slug-length=30
app.gemini.max-tags=5

# ?????????????????????????????????????????
# Actuator
# ?????????????????????????????????????????
management.endpoints.web.exposure.include=health,info